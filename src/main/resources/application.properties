# --- Configuración MySQL (Variables de Entorno) ---
server.port=8081
# En local usa localhost, en Railway usa las variables que ellos inyectan
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:clinica_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable Flyway automatic migrations here because Flyway core is having compatibility
# issues with the database server version in this environment. Hibernate `update`
# will add the `folio` column and the DataLoader will populate missing folios.
spring.flyway.enabled=false

