<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Citas - Clínica Salud</title>
    <link rel="stylesheet" href="diseño.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>ClínicaPsico</h2>
            <span>Gestión de Citas</span>
        </div>
        <nav class="nav-links">
            <a href="#" class="nav-link active">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Agenda
            </a>
            <a href="#" class="nav-link">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Pacientes
            </a>
            <a href="#" class="nav-link">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Configuración
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- Header Superior -->
        <header class="top-header">
            <div class="btn-group">
                <button class="btn-left" onclick="switchView('week')">Semana</button>
                <button class="btn-right" onclick="switchView('day')">Día</button>
            </div>

            <div class="nav-controls" style="display: flex; align-items: center; gap: 1rem;">
                <button onclick="changeDate(-1)" style="padding: 0.25rem 0.5rem; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: white;">&lt;</button>
                <span id="currentDateLabel" style="font-weight: 600; min-width: 150px; text-align: center;">Hoy</span>
                <button onclick="changeDate(1)" style="padding: 0.25rem 0.5rem; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: white;">&gt;</button>
            </div>

            <button class="btn-add" onclick="openModal()">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                Agendar Cita
            </button>
        </header>

        <!-- Calendario Grid -->
        <div class="calendar-container">
            <div class="calendar-grid" id="calendarGrid">
                <!-- El contenido se generará dinámicamente con JS -->
            </div>
        </div>
    </main>

    <!-- MODAL DE CREACIÓN (Con el formulario funcional) -->
    <div id="createModal" class="modal-overlay">
        <div class="modal-content">
            <form id="citaForm">
                <div class="modal-header">
                    <h3>Agendar Nueva Cita</h3>
                    <button type="button" class="close-btn" onclick="closeModal()">&times;</button>
                </div>
                
                <div class="modal-body">
                    <div class="form-grid">
                        <!-- Campos del formulario original -->
                        <div class="form-group">
                            <label for="nombre">Nombres</label>
                            <input type="text" id="nombre" placeholder="Ingrese nombres" required>
                        </div>
                        <div class="form-group">
                            <label for="apellidos">Apellidos</label>
                            <input type="text" id="apellidos" placeholder="Ingrese apellidos" required>
                        </div>

                        <div class="form-group">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" placeholder="Ej: 999-123-4567" required>
                        </div>
                        <div class="form-group">
                            <label for="correo">Correo electrónico</label>
                            <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="form-group">
                            <label for="sessionTypeSelect">Tipo de Sesión</label>
                            <select id="sessionTypeSelect" required>
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="therapistSelect">Terapeuta</label>
                            <select id="therapistSelect" required>
                                <option value="">Cargando...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fecha">Fecha</label>
                            <input type="date" id="fecha" required>
                        </div>
                        <div class="form-group">
                            <label for="hora">Hora Inicio</label>
                            <select id="hora" required>
                                <option value="">-- Seleccione Hora --</option>
                                <option value="09:00">09:00 AM</option>
                                <option value="10:00">10:00 AM</option>
                                <option value="11:00">11:00 AM</option>
                                <option value="12:00">12:00 PM</option>
                                <option value="13:00">01:00 PM</option>
                                <option value="14:00">02:00 PM</option>
                                <option value="15:00">03:00 PM</option>
                                <option value="16:00">04:00 PM</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label for="comentarios">Comentarios</label>
                            <textarea id="comentarios" rows="3" placeholder="Detalles adicionales..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar Cita</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE DETALLES -->
    <div id="detailsModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detalles de la cita</h3>
                <button type="button" class="close-btn" onclick="closeDetailsModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p><strong>Tipo:</strong> <span id="detailType"></span></p>
                <p><strong>Paciente:</strong> <span id="detailPatient"></span></p>
                <p><strong>Folio:</strong> <span id="detailFolio"></span></p>
                <p><strong>Fecha:</strong> <span id="detailDate"></span></p>
                <p><strong>Hora inicio:</strong> <span id="detailStart"></span></p>
                <p><strong>Duración:</strong> <span id="detailDuration"></span></p>
                <p><strong>Sala:</strong> <span id="detailRoom"></span></p>
                <p><strong>Terapeuta:</strong> <span id="detailTherapist"></span></p>
                <p><strong>Estado:</strong> <span id="detailStatus"></span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="btnCancelAppt">Cancelar Cita</button>
                <button type="button" class="btn-save" onclick="closeDetailsModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- LÓGICA JAVASCRIPT (Conectada al Backend) -->
    <script>
        const API_BASE = '/api';

        // --- Funciones del Modal ---
        function openModal() {
            document.getElementById('createModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('createModal').classList.remove('active');
        }

        // --- Carga Inicial ---
        let currentView = 'week'; // 'week' | 'day'
        let currentDate = new Date();

        document.addEventListener('DOMContentLoaded', () => {
            cargarTerapeutas();
            cargarTiposSesion();
            updateDateLabel();
            renderCalendar(); // Cargar calendario al inicio
        });

        function changeDate(offset) {
            if (currentView === 'week') {
                currentDate.setDate(currentDate.getDate() + (offset * 7));
            } else {
                currentDate.setDate(currentDate.getDate() + offset);
            }
            updateDateLabel();
            renderCalendar();
        }

        function updateDateLabel() {
            const label = document.getElementById('currentDateLabel');
            if (currentView === 'week') {
                const monday = getMonday(currentDate);
                const friday = new Date(monday);
                friday.setDate(monday.getDate() + 4);
                label.textContent = `${monday.toLocaleDateString()} - ${friday.toLocaleDateString()}`;
            } else {
                label.textContent = currentDate.toLocaleDateString();
            }
        }

        // --- Funciones del Calendario ---
        function getMonday(d) {
            d = new Date(d);
            var day = d.getDay(),
                diff = d.getDate() - day + (day == 0 ? -6 : 1); // adjust when day is sunday
            return new Date(d.setDate(diff));
        }

        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '<div class="grid-cell full-width">Cargando...</div>';

            let endpoint = '';
            let params = '';

            if (currentView === 'week') {
                const monday = getMonday(currentDate);
                endpoint = `${API_BASE}/appointments/week`;
                params = `?monday=${formatDate(monday)}`;
            } else {
                endpoint = `${API_BASE}/appointments/day`;
                params = `?date=${formatDate(currentDate)}`;
            }

            fetch(endpoint + params)
                .then(res => res.json())
                .then(appointments => {
                    buildGrid(appointments);
                })
                .catch(err => {
                    console.error(err);
                    grid.innerHTML = '<div class="grid-cell full-width">Error cargando citas</div>';
                });
        }

        // --- Funciones del Modal de Detalles ---
        function openDetailsModal(appt) {
            document.getElementById('detailType').textContent = appt.sessionType;
            document.getElementById('detailPatient').textContent = appt.patientNombre;
            document.getElementById('detailFolio').textContent = appt.patientFolio || '---';
            
            const start = new Date(appt.start);
            const end = new Date(appt.end);
            const duration = (end - start) / (1000 * 60); // minutos

            document.getElementById('detailDate').textContent = start.toLocaleDateString();
            document.getElementById('detailStart').textContent = start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('detailDuration').textContent = duration + ' min';
            document.getElementById('detailRoom').textContent = appt.roomNombre || '---';
            document.getElementById('detailTherapist').textContent = appt.therapistNombre;
            
            // Normalizar estado a mayúsculas para comparación
            const status = appt.status ? appt.status.toUpperCase() : 'PENDIENTE';
            document.getElementById('detailStatus').textContent = status;

            const btnCancel = document.getElementById('btnCancelAppt');
            if (status === 'CANCELADO') {
                btnCancel.style.display = 'none';
            } else {
                btnCancel.style.display = 'inline-block';
                btnCancel.onclick = () => cancelAppointment(appt.id);
            }

            document.getElementById('detailsModal').classList.add('active');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        function cancelAppointment(id) {
            if (confirm('¿Está seguro de que desea cancelar esta cita? Esta acción no se puede deshacer.')) {
                fetch(`${API_BASE}/appointments/${id}/cancel`, {
                    method: 'POST'
                })
                .then(async res => {
                    if (res.ok) {
                        alert('Cita cancelada correctamente.');
                        closeDetailsModal();
                        renderCalendar();
                    } else {
                        const txt = await res.text();
                        alert('Error al cancelar: ' + txt);
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('Error de conexión.');
                });
            }
        }

        function buildGrid(appointments) {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = ''; // Limpiar

            // Definir días a mostrar
            let daysToShow = [];
            if (currentView === 'week') {
                const monday = getMonday(currentDate);
                for (let i = 0; i < 5; i++) { // Lunes a Viernes
                    let d = new Date(monday);
                    d.setDate(monday.getDate() + i);
                    daysToShow.push(d);
                }
            } else {
                daysToShow.push(currentDate);
            }

            // 1. Renderizar Encabezados
            // Columna Hora
            const timeHeader = document.createElement('div');
            timeHeader.className = 'grid-header';
            timeHeader.textContent = 'Hora';
            grid.appendChild(timeHeader);

            // Columnas Días
            const diasSemana = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            daysToShow.forEach(d => {
                const header = document.createElement('div');
                header.className = 'grid-header';
                header.innerHTML = `${diasSemana[d.getDay()]} <br> <span class="badge badge-green">${d.getDate()}</span>`;
                grid.appendChild(header);
            });

            // 2. Renderizar Filas de Horas (09:00 a 18:00)
            for (let hour = 9; hour <= 18; hour++) {
                // Celda de Hora
                const timeCell = document.createElement('div');
                timeCell.className = 'grid-cell time-col';
                timeCell.textContent = `${hour}:00`;
                grid.appendChild(timeCell);

                // Celdas para cada día
                daysToShow.forEach(dayDate => {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    
                    // Buscar cita para este día y hora
                    const appt = appointments.find(a => {
                        const aDate = new Date(a.start);
                        return aDate.getDate() === dayDate.getDate() && 
                               aDate.getMonth() === dayDate.getMonth() &&
                               aDate.getHours() === hour;
                    });

                    if (appt) {
                        const card = document.createElement('div');
                        card.className = 'appointment-card';
                        
                        // Normalizar estado a mayúsculas
                        const status = appt.status ? appt.status.toUpperCase() : 'PENDIENTE';

                        if (status === 'CANCELADO') {
                            card.classList.add('cancelled');
                        } else if (appt.sessionType === 'CITA_TERAPEUTICA') {
                             card.style.backgroundColor = '#bfdbfe';
                             card.style.borderColor = '#93c5fd';
                             card.style.color = '#1e40af';
                        }
                        
                        card.innerHTML = `<strong>${appt.patientNombre}</strong><br>${appt.therapistNombre}`;
                        card.onclick = () => openDetailsModal(appt);
                        cell.appendChild(card);
                    }

                    grid.appendChild(cell);
                });
            }
        }

        function switchView(view) {
            currentView = view;
            // Actualizar estilos de botones (simple)
            const btnLeft = document.querySelector('.btn-left');
            const btnRight = document.querySelector('.btn-right');
            if (view === 'week') {
                btnLeft.style.backgroundColor = 'var(--blue-600)';
                btnLeft.style.color = 'white';
                btnRight.style.backgroundColor = '#e5e7eb';
                btnRight.style.color = 'var(--text-gray-800)';
                // Ajustar grid CSS para semana (6 columnas)
                document.getElementById('calendarGrid').style.gridTemplateColumns = 'repeat(6, 1fr)';
            } else {
                btnRight.style.backgroundColor = 'var(--blue-600)';
                btnRight.style.color = 'white';
                btnLeft.style.backgroundColor = '#e5e7eb';
                btnLeft.style.color = 'var(--text-gray-800)';
                // Ajustar grid CSS para día (2 columnas: Hora + Día)
                document.getElementById('calendarGrid').style.gridTemplateColumns = 'repeat(2, 1fr)';
            }
            updateDateLabel();
            renderCalendar();
        }

        function cargarTerapeutas() {
            fetch(`${API_BASE}/catalogs/therapists`)
                .then(response => response.json())
                .then(data => {
                    const select = document.getElementById('therapistSelect');
                    select.innerHTML = '<option value="">-- Seleccione un Terapeuta --</option>';
                    data.forEach(t => {
                        const option = document.createElement('option');
                        option.value = t.id; 
                        // Usamos t.name porque así se llama en la clase Java
                        option.textContent = t.name; 
                        select.appendChild(option);
                    });
                })
                .catch(err => console.error("Error cargando terapeutas:", err));
        }

        function cargarTiposSesion() {
            fetch(`${API_BASE}/catalogs/session-types`)
                .then(response => response.json())
                .then(data => {
                    const select = document.getElementById('sessionTypeSelect');
                    select.innerHTML = '<option value="">-- Seleccione Tipo --</option>';
                    data.forEach(tipo => {
                        const option = document.createElement('option');
                        option.value = tipo; // El valor es el string (ej: "CITA_DE_TERAPIA")
                        option.textContent = tipo.replace(/_/g, ' '); // Muestra "CITA DE TERAPIA"
                        select.appendChild(option);
                    });
                })
                .catch(err => console.error("Error cargando tipos:", err));
        }

        // --- Enviar Formulario ---
        document.getElementById('citaForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            // Construimos el objeto tal cual lo espera el Backend
            const sessionTypeValue = document.getElementById('sessionTypeSelect').value;
            if (!sessionTypeValue) {
                alert("Seleccione el tipo de sesión.");
                return;
            }

            const appointmentData = {
                date: document.getElementById('fecha').value,
                startTime: document.getElementById('hora').value + ":00",
                therapistId: parseInt(document.getElementById('therapistSelect').value),
                roomId: 1,
                // patientId: 1, // YA NO USAMOS EL ID FIJO
                patientNombre: document.getElementById('nombre').value,
                patientApellido: document.getElementById('apellidos').value,
                patientTelefono: document.getElementById('telefono').value,
                patientEmail: document.getElementById('correo').value,
                sessionType: sessionTypeValue, 
                comments: `
                    Tipo: ${sessionTypeValue}. 
                    Nota: ${document.getElementById('comentarios').value}
                `
            };

            console.log("Enviando:", appointmentData);

            fetch(`${API_BASE}/appointments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(appointmentData)
            })
            .then(async response => {
                if (response.ok) {
                    const json = await response.json();
                    alert(`¡Cita agendada con éxito! ID: ${json.appointmentId}`);
                    document.getElementById('citaForm').reset();
                    closeModal();
                } else {
                    const errorText = await response.text();
                    alert(`Error del servidor: ${errorText}`);
                }
            })
            .catch(error => {
                console.error('Error de red:', error);
                alert("Error de conexión: No se pudo contactar al servidor.");
            });
        });
    </script>
</body>
</html>
